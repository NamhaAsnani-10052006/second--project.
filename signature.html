<body>

<header class="header">

    <nav class="navbar">

        <a
            href="index.html"
            class="logo"
        >

            <img
                src="nn.jpg.jpeg"
                alt="SEON"
                class="logo-icon"
            >

            <span class="logo-name">
                SEON<sup>™</sup>
            </span>

        </a>


        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="collection.html">
                    Collection
                </a>
            </li>

            <li>
                <a href="signature.html">

                </a>
            </li>

            <li>

                </a>
            </li>

            <li>
                <a href="reviews.html">
                    Reviews
                </a>
            </li>

        </ul>


        <div class="header-actions">

              <button
                    class="header-icon"
                    aria-label="Search"
                >
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>


    <a href="account.html" class="header-icon" aria-label="Account">
    <i class="fa-regular fa-user"></i>
</a>

                >

                    <span>0</span>

        </div>

</header>


<main class="signature-page">

    <section class="signature-product">

        <div class="signature-visual">

            <div class="signature-bottle">

                <span>SEON</span>

                <strong>
                    MAGNETIC
                </strong>

            </div>

        </div>


        <div class="signature-info">

            <p class="section-tag">

                <span></span>

                SEON SIGNATURE

            </p>


            <h1>

                SEON
                <em>
                    Magnetic.
                </em>

            </h1>


            <p class="signature-description">

                A bold expression of confidence,
                crafted with captivating notes
                that turn every entrance into
                a memory.

            </p>


            <div class="signature-price">

                ₹399

                <small>
                    50 ML
                </small>

            </div>


            <div class="signature-notes">

                <div>
                    <strong>
                        TOP
                    </strong>

                    Magnetic
                </div>

                <div>
                    <strong>
                        HEART
                    </strong>

                    Gentle
                </div>

                <div>
                    <strong>
                        BASE
                    </strong>

                    Blanc
                </div>

            </div>


            <button
                class="signature-add"
                type="button"
            >

                ADD TO COLLECTION

                <i
                    class="fa-solid fa-plus"
                ></i>

            </button>


            <a
                href="collection.html"
                class="button-outline"
            >
                Explore Collection
            </a>

        </div>

    </section>
