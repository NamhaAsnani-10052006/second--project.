<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SEON — Your Bag</title>

    <link
        rel="stylesheet"
        href="ghh.css"
    >

    <link
        rel="stylesheet"
        href="inner-pages.css"
    >

</head>


<body>

<header class="header">

    <nav class="navbar">

        <a
            href="index.html"
            class="logo"
        >

            <img
                src="nn.jpg.jpeg"
                alt="SEON"
                class="logo-icon"
            >

            <span class="logo-name">
                SEON<sup>™</sup>
            </span>

        </a>


        <ul class="nav-links">

            <li>
                <a href="ghh.html">
                    Home
                </a>
            </li>

            <li>
                <a href="collection.html">
                    Collection
                </a>
            </li>

            <li>
                <a href="signature.html">
                    Signature
                </a>
            </li>

            <li>
                <a href="story.html">
                    Our Story
                </a>
            </li>

            <li>
                <a href="reviews.html">
                    Reviews
                </a>
            </li>

        </ul>


        <div class="header-actions">

            <button
                class="header-icon cart-icon"
            >

                🛍

                <span>0</span>

            </button>

        </div>

    </nav>

</header>


<main class="inner-page">

    <section class="inner-hero">

        <p class="section-tag">

            <span></span>

            YOUR SELECTION

        </p>

        <h1>

            Your
            <em>Collection.</em>

        </h1>

    </section>


    <section class="cart-layout">

        <div
            id="seon-cart-items"
            class="seon-cart-items"
        >
        </div>


        <aside class="cart-summary">

            <p>
                ORDER SUMMARY
            </p>

            <h2 id="seon-cart-total">
                ₹0
            </h2>

            <button
                id="seon-checkout-button"
                class="button-primary"
            >
                PROCEED TO CHECKOUT
            </button>

            <a
                href="collection.html"
                class="button-outline"
            >
                CONTINUE SHOPPING
            </a>

        </aside>

    </section>

</main>


<script src="ghh.js"></script>

</body>

</html>
